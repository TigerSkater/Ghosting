<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Squash Ghosting Drill</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    :root { --ink:#2c3e50; --accent:#8e44ad; }

    *{ 
      box-sizing:border-box; 
    }

    body{ 
      background:#f7e7ce; 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; 
      color:#333; 
      text-align:center; 
      padding:20px; 
    }

    h1{ 
      font-family:'Dancing Script', cursive; 
      font-size:3rem; 
      color:#722f37; 
      text-shadow:1px 1px 2px #f2acb3; 
      margin:0 0 12px; 
    }

    #floatingGhost{ 
      position:fixed; 
      top:20px; 
      right:20px; 
      width:80px; 
      opacity:.9; 
      z-index:10; 
      animation:floatGhost 3s ease-in-out infinite; 
      pointer-events:none; 
    }

    @keyframes floatGhost{ 
      0%{transform:translateY(0)} 
      50%{transform:translateY(-15px)} 
      100%{transform:translateY(0)} 
    }

    #configContainer{ 
      max-width:560px; 
      margin:0 auto; 
    }

    .code-box{
      background:#fff8fb;
      border:2px solid #e8b4c7;
      border-radius:16px;
      padding:16px;
      margin:12px 0 18px;
      box-shadow:0 6px 18px rgba(114,47,55,0.12);
    }

    .code-box label{
      display:block;
      font-weight:800;
      color:#722f37;
      margin-bottom:8px;
    }

    .code-row{
      display:flex;
      gap:8px;
      justify-content:center;
      align-items:center;
    }

    #codeInput{
      flex:1;
      padding:10px 12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:1rem;
    }

    #applyCodeBtn{
      margin-top:0;
      white-space:nowrap;
    }

    #welcomeMessage{
      display:none;
      margin-top:12px;
      padding:12px;
      border-radius:14px;
      background:linear-gradient(135deg, #fff0f6, #f3e8ff);
      color:#722f37;
      font-weight:900;
      font-size:1.2rem;
      animation:popIn .45s ease;
      box-shadow:0 4px 12px rgba(142,68,173,0.18);
    }

    @keyframes popIn{
      0%{ transform:scale(.8); opacity:0; }
      70%{ transform:scale(1.05); opacity:1; }
      100%{ transform:scale(1); opacity:1; }
    }

    .sparkle{
      animation:sparkle 1.2s ease-in-out infinite alternate;
    }

    @keyframes sparkle{
      from{ text-shadow:0 0 4px #fff; }
      to{ text-shadow:0 0 10px #e879f9, 0 0 18px #f9a8d4; }
    }

    .row{ 
      display:flex; 
      align-items:center; 
      gap:10px; 
      margin:8px 0; 
    }

    .row>label{ 
      flex:1; 
      text-align:left; 
    }

    .row>input{ 
      flex:1; 
      padding:8px 10px; 
      border:1px solid #ccc; 
      border-radius:8px; 
    }

    .direction-grid{ 
      display:grid; 
      grid-template-rows:repeat(3,auto); 
      gap:12px; 
      justify-content:center; 
      margin-top:16px; 
    }

    .dir-row{ 
      display:flex; 
      justify-content:center; 
      gap:16px; 
    }

    .row-head{ 
      font-weight:700; 
      color:#444; 
      margin-top:6px; 
    }

    .direction-btn{ 
      width:120px; 
      height:120px; 
      border:1px solid #ddd; 
      border-radius:10px; 
      background:#fff; 
      padding:0; 
      cursor:pointer; 
    }

    .direction-btn.active{ 
      outline: 3px solid #0ea5a4; 
    }

    .direction-btn img{ 
      width:100%; 
      height:100%; 
      object-fit:contain; 
    }

    button{ 
      padding:10px 16px; 
      border:0; 
      border-radius:8px; 
      background:#b35a7a; 
      color:#fff; 
      cursor:pointer; 
      margin-top:10px; 
      font-size:1rem;
    }

    button:disabled{ 
      opacity:.6; 
      cursor:not-allowed; 
    }

    #error-message{ 
      color:#c00; 
      font-weight:700; 
      min-height:1.2em; 
      margin-top:6px; 
    }

    #drillView{ 
      display:none; 
      max-width:720px; 
      margin:0 auto; 
    }

    #drillView.active{ 
      display:block; 
    }

    #setStatus{
      font-size:1.4rem;
      font-weight:800;
      color:#722f37;
      margin-top:8px;
      min-height:1.8rem;
    }

    #direction{ 
  font-size:4.5rem; 
  font-weight:900; 
  color:var(--ink); 
  margin:10px 0; 
  min-height:5rem; 
  }

    #countdown{ 
  font-size:8rem; 
  font-weight:900;
  color:var(--accent); 
  min-height:8.5rem; 
  line-height:1;
  }

    #image{ 
      width:85vw; 
      max-width:520px; 
      height:auto; 
      display:none; 
      margin:10px auto; 
      background:#fff; 
      border-radius:12px; 
      border:1px solid #eee; 
    }

    #skipBreakBtn{
      display:none;
      background:#6b7280;
      margin-left:8px;
    }

    #endView{ 
      display:none; 
      max-width:720px; 
      margin:0 auto; 
    }

    #endView.active{ 
      display:block; 
    }

    #endView h2{ 
      font-family:'Dancing Script', cursive; 
      font-size:2.6rem; 
      color:#2c3e50; 
      margin:18px 0 6px; 
    }

    #endView p{ 
      font-size:1.2rem; 
      color:#444; 
      margin:0 0 12px; 
    }
  </style>
</head>

<body>
  <img src="https://i.pinimg.com/originals/99/37/30/993730e1d3019ac8611e2401b63fbc16.gif" alt="Floating Ghost" id="floatingGhost" />

  <h1>Squash Ghosting Drill</h1>

  <div id="configContainer">

    <div class="code-box">
      <label for="codeInput">Enter Training Code</label>

      <div class="code-row">
        <input type="text" id="codeInput" placeholder="Enter code">
        <button id="applyCodeBtn">Apply Code</button>
      </div>

      <div id="welcomeMessage"></div>
    </div>

    <div class="row">
      <label for="setsInput">Number of Sets</label>
      <input type="number" id="setsInput" min="1" step="1" placeholder="e.g., 3">
    </div>

    <div class="row">
      <label for="movesInput">Moves per Set</label>
      <input type="number" id="movesInput" min="1" step="1" placeholder="e.g., 10">
    </div>

    <div class="row">
      <label for="secondsInput">Reaction Time (s)</label>
      <input type="number" id="secondsInput" min="0.1" step="0.1" placeholder="e.g., 1.2">
    </div>

    <div class="row">
      <label for="moveBreakInput">Reposition Time (s)</label>
      <input type="number" id="moveBreakInput" min="0" step="0.1" placeholder="e.g., 0.6">
    </div>

    <div class="row">
      <label for="setBreakInput">Rest Between Sets (s)</label>
      <input type="number" id="setBreakInput" min="0" step="1" placeholder="e.g., 20">
    </div>

    <div class="direction-grid" id="directionButtons"></div>

    <button id="startBtn">Start Drill</button>

    <div id="error-message"></div>
  </div>

  <div id="drillView">
    <div id="setStatus"></div>
    <div id="direction"></div>
    <div id="countdown"></div>

    <img id="image" src="" alt="Direction">

    <button id="stopBtn">Stop</button>
    <button id="skipBreakBtn">Skip Break</button>
  </div>

  <div id="endView">
    <h2>🎉 Congratulations! Drill Complete 🎉</h2>
    <p>Nice work — you finished the session.</p>
    <button id="restartBtn">Run Again</button>
  </div>

  <script>
    const allDirections = [
      { name: 'Front Left',  key: 'front-left',  row:0 },
      { name: 'Front Right', key: 'front-right', row:0 },
      { name: 'Side Left',   key: 'side-left',   row:1 },
      { name: 'Side Right',  key: 'side-right',  row:1 },
      { name: 'Back Left',   key: 'back-left',   row:2 },
      { name: 'Back Right',  key: 'back-right',  row:2 }
    ];

    const beep = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
    beep.preload = 'auto';

    const selected = Object.fromEntries(allDirections.map(d => [d.key, true]));

    const els = {
      config: document.getElementById('configContainer'),
      drill: document.getElementById('drillView'),
      end: document.getElementById('endView'),
      setStatus: document.getElementById('setStatus'),
      direction: document.getElementById('direction'),
      countdown: document.getElementById('countdown'),
      image: document.getElementById('image'),
      dirBtns: document.getElementById('directionButtons'),
      start: document.getElementById('startBtn'),
      stop: document.getElementById('stopBtn'),
      restart: document.getElementById('restartBtn'),
      skipBreak: document.getElementById('skipBreakBtn'),
      error: document.getElementById('error-message'),
      codeInput: document.getElementById('codeInput'),
      applyCode: document.getElementById('applyCodeBtn'),
      welcome: document.getElementById('welcomeMessage')
    };

    let controller = null;
    let skipBreakRequested = false;

    function buildButtons(){
      els.dirBtns.innerHTML = '';

      const rows = [[], [], []];

      allDirections.forEach(d => rows[d.row].push(d));

      const labels = ['Front', 'Side', 'Back'];

      rows.forEach((r, i) => {
        const head = document.createElement('div');
        head.className = 'row-head';
        head.textContent = labels[i];
        els.dirBtns.appendChild(head);

        const rowDiv = document.createElement('div');
        rowDiv.className = 'dir-row';

        r.forEach(d => {
          const btn = document.createElement('button');
          btn.className = 'direction-btn active';
          btn.dataset.key = d.key;

          const img = document.createElement('img');
          img.src = `images/${d.key}.png`;
          img.alt = d.name;

          btn.appendChild(img);

          btn.onclick = () => {
            selected[d.key] = !selected[d.key];
            btn.classList.toggle('active', selected[d.key]);
          };

          rowDiv.appendChild(btn);
        });

        els.dirBtns.appendChild(rowDiv);
      });
    }

    function preloadImages(){
      allDirections.forEach(d => {
        const im = new Image();
        im.src = `images/${d.key}.png`;
      });
    }

    function applyTrainingCode(){
      const code = els.codeInput.value.trim().toLowerCase();

      if(code === 'sofiatang'){
        document.getElementById('setsInput').value = 10;
        document.getElementById('movesInput').value = 12;
        document.getElementById('secondsInput').value = 3;
        document.getElementById('moveBreakInput').value = 0.2;
        document.getElementById('setBreakInput').value = 45;

        els.error.textContent = '';

        els.welcome.style.display = 'block';
        els.welcome.innerHTML = `
          <span class="sparkle">✨ Welcome back, Sofia ✨</span><br>
          Elite ghosting mode activated: 10 sets · 12 moves · 3s reaction · 0.2s reset · 45s rest
        `;

        els.applyCode.textContent = 'Code Applied ✓';

        setTimeout(() => {
          els.applyCode.textContent = 'Apply Code';
        }, 1800);

      } else {
        els.welcome.style.display = 'none';
        els.error.textContent = '⚠️ Invalid code. Try again.';
      }
    }

    function validate(){
      const defs = [
        ['setsInput', 'Number of Sets', 1],
        ['movesInput', 'Moves per Set', 1],
        ['secondsInput', 'Reaction Time (s)', 0.1],
        ['moveBreakInput', 'Reposition Time (s)', 0],
        ['setBreakInput', 'Rest Between Sets (s)', 0]
      ];

      for(const [id, label, min] of defs){
        const val = document.getElementById(id).value.trim();

        if(!val) {
          return `${label} is required.`;
        }

        const n = parseFloat(val);

        if(isNaN(n) || n < min) {
          return `${label} must be ≥ ${min}.`;
        }
      }

      if(!Object.values(selected).some(Boolean)) {
        return 'Select at least one direction!';
      }

      return '';
    }

    function sleep(ms, signal){
      return new Promise((res, rej) => {
        if(signal?.aborted) return rej();

        const id = setTimeout(res, ms);

        signal?.addEventListener('abort', () => {
          clearTimeout(id);
          rej();
        }, { once:true });
      });
    }

    function pick(arr){
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function skipBreak(){
      skipBreakRequested = true;
    }

    function unlockAudioOnce(){
      try{
        beep.play()
          .then(() => beep.pause())
          .catch(() => {});
      } catch(e){}

      document.removeEventListener('click', unlockAudioOnce);
      document.removeEventListener('touchstart', unlockAudioOnce);
    }

    document.addEventListener('click', unlockAudioOnce, { once:true });
    document.addEventListener('touchstart', unlockAudioOnce, { once:true });

    async function run(){
      const err = validate();

      if(err){
        els.error.textContent = '⚠️ ' + err;
        return;
      }

      els.error.textContent = '';

      const totalSets = +document.getElementById('setsInput').value;
      const movesPerSet = +document.getElementById('movesInput').value;
      const secondsPerMove = +document.getElementById('secondsInput').value;
      const breakPerMove = +document.getElementById('moveBreakInput').value;
      const breakPerSet = +document.getElementById('setBreakInput').value;

      const enabled = allDirections.filter(d => selected[d.key]);

      controller = new AbortController();
      const { signal } = controller;

      els.config.style.display = 'none';
      els.end.classList.remove('active');
      els.drill.classList.add('active');
      els.start.disabled = true;

      try{
        for(let s = 1; s <= totalSets; s++){
          els.setStatus.textContent = `Set ${s} of ${totalSets}`;

          for(let m = 1; m <= movesPerSet; m++){
            const step = pick(enabled);

            els.direction.textContent = step.name;
            els.countdown.textContent = '';
            els.image.src = `images/${step.key}.png`;
            els.image.style.display = 'block';

            try{
              beep.currentTime = 0;
              beep.play();
            } catch(e){}

            await sleep(secondsPerMove * 1000, signal);

            els.direction.textContent = '';
            els.image.removeAttribute('src');
            els.image.style.display = 'none';

            try{
              beep.currentTime = 0;
              beep.play();
            } catch(e){}

            if(breakPerMove > 0){
              await sleep(breakPerMove * 1000, signal);
            }
          }

          if(s < totalSets){
            els.setStatus.textContent = `Break after Set ${s}`;
            els.direction.textContent = 'Rest';
            els.skipBreak.style.display = 'inline-block';
            skipBreakRequested = false;

            for(let t = Math.max(0, Math.round(breakPerSet)); t > 0; t--){
              if(skipBreakRequested) break;

              els.countdown.textContent = String(t);

              try{
                beep.currentTime = 0;
                beep.play();
              } catch(e){}

              await sleep(1000, signal);
            }

            els.skipBreak.style.display = 'none';
            els.countdown.textContent = '';
            els.direction.textContent = '';
          }
        }

        els.drill.classList.remove('active');
        els.end.classList.add('active');
        els.setStatus.textContent = '';

      } catch(e){
        stop();
      }
    }

    function stop(){
      controller?.abort();
      controller = null;

      els.start.disabled = false;
      els.drill.classList.remove('active');
      els.end.classList.remove('active');
      els.config.style.display = 'block';

      els.setStatus.textContent = '';
      els.direction.textContent = '';
      els.countdown.textContent = '';
      els.skipBreak.style.display = 'none';

      els.image.removeAttribute('src');
      els.image.style.display = 'none';
    }

    function restart(){
      els.end.classList.remove('active');
      els.config.style.display = 'block';
      els.start.disabled = false;
    }

    buildButtons();
    preloadImages();

    els.start.onclick = run;
    els.stop.onclick = stop;
    els.restart.onclick = restart;
    els.skipBreak.onclick = skipBreak;
    els.applyCode.onclick = applyTrainingCode;

    els.codeInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        applyTrainingCode();
      }
    });
  </script>
</body>
</html>
